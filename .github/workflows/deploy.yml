# ---------------------------------------------------------------------------
# Build & deploy to Azure Container Apps
#
# On every push to main: build the image, push it to ACR tagged with the
# commit SHA, and roll it out to the `pdf-ingestion-web` Container App.
#
# Auth: OIDC federated credential on the `github-nous-deployer` managed
# identity. Requires the AZURE_CLIENT_ID / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID secrets (org level).
#
# Env values all live on the Container App. NEXT_PUBLIC_* values are inlined
# into the bundle at build time, so this workflow reads them from the Container
# App and passes them as build args. After changing one there, re-run this
# workflow so the image is rebuilt with it.
# ---------------------------------------------------------------------------

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  id-token: write # OIDC login to Azure
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: Nous-Azure
  ACR_NAME: nouscontainerregistry
  ACR_LOGIN_SERVER: nouscontainerregistry-dydgemargghucgcz.azurecr.io
  IMAGE_NAME: pdf-ingestion-web
  WEB_APP: pdf-ingestion-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # An unset value would be passed as an empty build arg and silently
      # override the Dockerfile default, so fail early instead.
      - name: Read build-time values from the Container App
        run: |
          app_env=$(az containerapp show --name "$WEB_APP" --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env" -o json)
          missing=0
          for name in NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_WS_BASE_URL \
                      NEXT_PUBLIC_MAX_FILE_SIZE_MB NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY; do
            value=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .value // empty' <<< "$app_env")
            if [ -z "$value" ]; then
              echo "::error::$name is not set (as a plain value) on Container App $WEB_APP"
              missing=1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name=$value"
          done
          exit $missing

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_BASE_URL=${{ env.NEXT_PUBLIC_WS_BASE_URL }}
            NEXT_PUBLIC_MAX_FILE_SIZE_MB=${{ env.NEXT_PUBLIC_MAX_FILE_SIZE_MB }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy web app
        run: |
          az containerapp update \
            --name "$WEB_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            --query "properties.latestRevisionName" -o tsv
